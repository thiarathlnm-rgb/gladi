<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: #fff0f3;
            width: 100%;
            max-width: 660px;
            padding: 40px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 45px rgba(233, 30, 99, 0.12);
            text-align: center;
            border: 2px solid #ffccd5;
        }

        .card img {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            object-fit: cover;
            border: 4px solid #ffb7b2;
            margin-bottom: 18px;
            box-shadow: 0 8px 20px rgba(255, 183, 178, 0.4);
        }

        .card h1 {
            font-size: 32px;
            color: #222222;
            margin-bottom: 8px;
        }

        .card .role {
            font-size: 17px;
            color: #666666;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .info-box {
            text-align: left;
            background: #fff9fa;
            padding: 22px 30px;
            border-radius: 20px;
            border: 1px solid #ffccd5;
        }

        .info-item {
            display: flex;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            color: #444444;
            width: 150px; /* Lebar tetap untuk label agar titik dua lurus */
            flex-shrink: 0;
        }

        .info-colon {
            font-weight: 600;
            color: #444444;
            margin-right: 15px;
        }

        .info-value {
            color: #222222;
            text-align: left; /* Diubah rata kiri agar rapi */
            font-weight: 500;
        }

        .color-badge {
            display: inline-block;
            background: #222222;
            color: #ffb7b2;
            padding: 4px 15px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Foto Profil -->
        <img src="raaww.jpeg" alt="Foto Profil">
        
        <!-- Nama Lengkap -->
        <h1>Thiara Thaulanie Marta</h1>
        <div class="role">Mahasiswa Universitas Pembangunan Jaya</div>

        <!-- Detail Informasi -->
        <div class="info-box">
            <div class="info-item">
                <span class="info-label">Jurusan</span>
                <span class="info-colon">:</span>
                <span class="info-value">Sistem Informasi</span>
            </div>
            <div class="info-item">
                <span class="info-label">NIM</span>
                <span class="info-colon">:</span>
                <span class="info-value">2025081057</span>
            </div>
            <div class="info-item">
                <span class="info-label">Email</span>
                <span class="info-colon">:</span>
                <span class="info-value">thiarathlnm@gmail.com</span>
            </div>
            <div class="info-item">
                <span class="info-label">Peran</span>
                <span class="info-colon">:</span>
                <span class="info-value">Anggota</span>
            </div>
            <div class="info-item">
                <span class="info-label">Zodiak</span>
                <span class="info-colon">:</span>
                <span class="info-value">Sagitarius</span>
            </div>
            <div class="info-item">
                <span class="info-label">Warna Kesukaan</span>
                <span class="info-colon">:</span>
                <span class="info-value">
                    <span class="color-badge">Pink & Hitam</span>
                </span>
            </div>
        </div>
    </div>

</body>
</html>
